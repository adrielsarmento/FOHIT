<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLICK</title>
  <style>
    #bloco {
      background-color: blue;
      height: 200px;
      width: 200px;
      line-height: 200px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="bloco">CLICK</div>
  <script>
    var a = window.document.getElementById('bloco')

    a.addEventListener('click', clicar)

    function clicar() {
      a.inneHTML = 'clicou'
    }
  </script>
</body>
</html>
