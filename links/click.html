<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLICK</title>
  <link rel="shortcut icon" href="../[FOHIT].ico" type="image/x-icon">
  <link rel="stylesheet" href="../estilo/CLICK.css">
</head>
<body>
  <div class="bloco">CLIQUE</div>
  <a href="games.html">voltar</a>
  <script>
    var a = window.document.querySelector('div.bloco')

    a.addEventListener('click', clicar)
    a.addEventListener('mouseout', saiu)
    a.addEventListener('mouseenter', lá_ele)

    function clicar() {
      a.innerHTML = 'CLICOU'
      a.style.background = 'green'
    }
    function saiu() {
      a.innerHTML = 'SAIU'
      a.style.background = 'red'
    }
    function lá_ele() {
      a.innerHTML = 'ENTROU, LÁ ELE'
      a.style.background = 'yellow'
    }
  </script>
</body>
</html>
